        // ---- Combined Contact & Visit Form ----
        function initContactForm() {
            const dateInput = document.getElementById('cf-date');
            if (dateInput) dateInput.min = new Date().toISOString().split('T')[0];
        }

        async function submitContactForm(e) {
            e.preventDefault();
            const btn = document.getElementById('cf-btn');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            let userId;
            try {
                const meRes = await api.getMe();
                if (!meRes.success) {
                    showContactAlert('Please log in to schedule a visit.', 'error');
                    btn.disabled = false; btn.textContent = 'Schedule Visit & Send Message';
                    return;
                }
                userId = meRes.data.id;
            } catch (_) {
                showContactAlert('Unable to verify login. Please try again.', 'error');
                btn.disabled = false; btn.textContent = 'Schedule Visit & Send Message';
                return;
            }

            const agentUserId = currentProperty.agentId;
            if (!agentUserId || agentUserId <= 0) {
                showContactAlert('Unable to determine the agent for this property.', 'error');
                btn.disabled = false; btn.textContent = 'Schedule Visit & Send Message';
                return;
            }

            let agentId;
            try {
                const agentRes = await api.getAgentByUserId(agentUserId);
                if (!agentRes.success || !agentRes.data) {
                    showContactAlert('Could not find the agent profile for this property.', 'error');
                    btn.disabled = false; btn.textContent = 'Schedule Visit & Send Message';
                    return;
                }
                agentId = agentRes.data.id;
            } catch (_) {
                showContactAlert('Could not resolve agent. Please try again.', 'error');
                btn.disabled = false; btn.textContent = 'Schedule Visit & Send Message';
                return;
            }

            const date = document.getElementById('cf-date').value;
            const time = document.getElementById('cf-time').value;

            try {
                const res = await api.scheduleVisit({
                    userId:            userId,
                    agentId:           agentId,
                    appointmentDate:   date,
                    appointmentTime:   time + ':00',
                    propertyType:      currentProperty.category,
                    appointmentStatus: 'pending'
                });

                if (res.success) {
                    showContactAlert('Visit scheduled! The agent will confirm your appointment.', 'success');
                    document.getElementById('contact-form').reset();
                } else {
                    showContactAlert(res.message || 'Failed to schedule visit.', 'error');
                }
            } catch (_) {
                showContactAlert('Connection error. Please try again.', 'error');
            }

            btn.disabled = false; btn.textContent = 'Schedule Visit & Send Message';
        }

        function showContactAlert(msg, type) {
            const el = document.getElementById('contact-alert');
            if (!el) return;
            el.textContent = msg;
            el.className = `mb-4 p-3 rounded-lg text-sm ${type === 'error'
                ? 'bg-red-50 text-red-700 border border-red-200'
                : 'bg-green-50 text-green-700 border border-green-200'}`;
            el.classList.remove('hidden');
        }

        loadDetail().then(initContactForm);
