<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard – PrimeEstate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#1a3c5e', light: '#2d6a9f', dark: '#0f2540' },
                        accent:  { DEFAULT: '#e8a020', light: '#f0b93a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <nav class="bg-primary text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="../index.html" class="flex items-center space-x-1">
                <span class="text-accent text-2xl font-bold">Prime</span>
                <span class="text-white text-2xl font-bold">Estate</span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="../index.html" class="hover:text-accent transition">Home</a>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition hidden">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="flex-1 max-w-5xl mx-auto w-full px-4 py-8">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <div class="border-b border-gray-100 pb-6 mb-6 flex justify-between items-end">
                <div>
                    <h1 class="text-3xl font-bold text-primary">User Dashboard</h1>
                    <p class="text-gray-500 text-sm mt-1">Manage your activities and account settings</p>
                </div>
            </div>

            <div id="alert" class="hidden mb-6 p-4 rounded-lg text-sm"></div>

            <!-- Tabs -->
            <div class="flex border-b border-gray-200 mb-6">
                <button id="tab-history" class="py-2 px-6 font-semibold border-b-2 border-primary text-primary">Overview & History</button>
                <button id="tab-settings" class="py-2 px-6 font-semibold border-b-2 border-transparent text-gray-500 hover:text-primary transition">Account Settings</button>
            </div>

            <!-- History View -->
            <div id="view-history">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Properties Bought / Inquired</h2>
                <div class="bg-gray-50 rounded-lg p-4 mb-8 border border-gray-200">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-100 text-gray-700 text-xs uppercase font-semibold border-b border-gray-200">
                            <tr>
                                <th class="px-4 py-2">ID</th>
                                <th class="px-4 py-2">Title</th>
                                <th class="px-4 py-2">Price</th>
                                <th class="px-4 py-2">Status</th>
                            </tr>
                        </thead>
                        <tbody id="propertiesTableBody" class="divide-y divide-gray-100">
                            <tr><td colspan="4" class="px-4 py-4 text-center text-gray-400">Loading properties...</td></tr>
                        </tbody>
                    </table>
                </div>

                <h2 class="text-xl font-bold text-gray-800 mb-4">Agents Contacted (Appointments)</h2>
                <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-100 text-gray-700 text-xs uppercase font-semibold border-b border-gray-200">
                            <tr>
                                <th class="px-4 py-2">ID</th>
                                <th class="px-4 py-2">Date</th>
                                <th class="px-4 py-2">Time</th>
                                <th class="px-4 py-2">Status</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsTableBody" class="divide-y divide-gray-100">
                            <tr><td colspan="4" class="px-4 py-4 text-center text-gray-400">Loading appointments...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Settings View -->
            <div id="view-settings" class="hidden">
                <form id="profile-form" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                            <input id="fullName" type="text" required
                                   class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                            <input id="email" type="email" required disabled
                                   class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm bg-gray-50 text-gray-500 cursor-not-allowed" />
                            <p class="text-xs text-gray-400 mt-1">Email cannot be changed.</p>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Phone Number</label>
                            <input id="phone" type="tel"
                                   class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Preferred Location</label>
                            <input id="preferredLocation" type="text" placeholder="e.g. Colombo"
                                   class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Preferred Agent Specialization</label>
                            <select id="preferredAgentSpecialization" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary bg-white">
                                <option value="">Any</option>
                                <option value="Residential">Residential</option>
                                <option value="Commercial">Commercial</option>
                                <option value="Luxury">Luxury</option>
                                <option value="Rental">Rental</option>
                            </select>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-gray-100 flex items-center justify-between">
                        <button type="button" id="deleteAccountBtn" class="text-red-600 hover:text-red-800 font-semibold text-sm transition">
                            Delete Account
                        </button>
                        <button type="submit" class="bg-primary text-white px-8 py-2.5 rounded-lg font-semibold hover:bg-primary-dark transition shadow-md">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await api.getMe();
                if (res.success && res.data && res.data.id !== undefined && res.data.id !== null) {
                    currentUser = res.data;
                    document.getElementById('logoutBtn').classList.remove('hidden');
                    loadProfileData(currentUser.id);
                    loadHistoryData(currentUser.id);
                } else {
                    // If no valid user id, force login
                    window.location.href = 'login.html';
                }
            } catch (err) {
                console.error(err);
                window.location.href = 'login.html';
            }
        });

        // Tab Switching Logic
        const tabHistory = document.getElementById('tab-history');
        const tabSettings = document.getElementById('tab-settings');
        const viewHistory = document.getElementById('view-history');
        const viewSettings = document.getElementById('view-settings');

        tabHistory.addEventListener('click', () => {
            tabHistory.classList.add('border-primary', 'text-primary');
            tabHistory.classList.remove('border-transparent', 'text-gray-500');
            tabSettings.classList.add('border-transparent', 'text-gray-500');
            tabSettings.classList.remove('border-primary', 'text-primary');
            viewHistory.classList.remove('hidden');
            viewSettings.classList.add('hidden');
        });

        tabSettings.addEventListener('click', () => {
            tabSettings.classList.add('border-primary', 'text-primary');
            tabSettings.classList.remove('border-transparent', 'text-gray-500');
            tabHistory.classList.add('border-transparent', 'text-gray-500');
            tabHistory.classList.remove('border-primary', 'text-primary');
            viewSettings.classList.remove('hidden');
            viewHistory.classList.add('hidden');
        });

        async function loadProfileData(userId) {
            try {
                const res = await api.getUser(userId);
                if (res.success && res.data) {
                    const user = res.data;
                    document.getElementById('fullName').value = user.name || '';
                    document.getElementById('email').value = user.email || '';
                    document.getElementById('phone').value = user.contactNumber || '';
                    document.getElementById('preferredLocation').value = user.preferredLocation || '';
                    document.getElementById('preferredAgentSpecialization').value = user.preferredAgentSpecialization || '';
                }
            } catch (err) {
                showAlert('Failed to load profile data', 'error');
            }
        }

        async function loadHistoryData(userId) {
            try {
                if (userId === undefined || userId === null) return;
                const res = await api.request('GET', `/api/users/history/${userId}`);
                
                const ptbody = document.getElementById('propertiesTableBody');
                const atbody = document.getElementById('appointmentsTableBody');
                
                if (res.success && res.data) {
                    const props = res.data.properties || [];
                    const apps = res.data.appointments || [];

                    if (props.length === 0) ptbody.innerHTML = '<tr><td colspan="4" class="px-4 py-4 text-center text-gray-400">No properties bought or saved.</td></tr>';
                    else {
                        ptbody.innerHTML = props.map(p => `
                            <tr class="hover:bg-white transition border-b border-gray-100">
                                <td class="px-4 py-3">#${p.id}</td>
                                <td class="px-4 py-3 font-semibold text-primary">${p.title || '-'}</td>
                                <td class="px-4 py-3">LKR ${p.price || '-'}</td>
                                <td class="px-4 py-3"><span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded">${p.status || 'AVAILABLE'}</span></td>
                            </tr>
                        `).join('');
                    }

                    if (apps.length === 0) atbody.innerHTML = '<tr><td colspan="4" class="px-4 py-4 text-center text-gray-400">No agents contacted yet.</td></tr>';
                    else {
                        atbody.innerHTML = apps.map(a => `
                            <tr class="hover:bg-white transition border-b border-gray-100">
                                <td class="px-4 py-3">#${a.id}</td>
                                <td class="px-4 py-3">${a.date || '-'}</td>
                                <td class="px-4 py-3">${a.time || '-'}</td>
                                <td class="px-4 py-3"><span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">${a.status || 'SCHEDULED'}</span></td>
                            </tr>
                        `).join('');
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const data = {
                name: document.getElementById('fullName').value.trim(),
                contactNumber: document.getElementById('phone').value.trim(),
                preferredLocation: document.getElementById('preferredLocation').value.trim(),
                preferredAgentSpecialization: document.getElementById('preferredAgentSpecialization').value
            };

            try {
                const res = await api.updateUser(currentUser.id, data);
                if (res.success) {
                    showAlert('Profile updated successfully!', 'success');
                    // Persist updated profile to storage so other pages (index) reflect the change
                    try {
                        const updated = res.data || {};
                        localStorage.setItem('user', JSON.stringify(updated));
                        sessionStorage.setItem('user', JSON.stringify(updated));
                        currentUser = updated;
                        // update displayed name in the settings form if returned differently
                        document.getElementById('fullName').value = updated.name || document.getElementById('fullName').value;
                    } catch (e) {
                        console.warn('Failed to persist updated user to storage', e);
                    }
                } else {
                    showAlert(res.message || 'Failed to update profile', 'error');
                }
            } catch (err) {
                showAlert('Connection error', 'error');
            }
        });

        document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
            if (!currentUser) return;
            if (!confirm('Are you sure you want to permanently delete your account? This action cannot be undone.')) return;
            
            try {
                const res = await api.deleteUser(currentUser.id);
                if (res.success) {
                    alert('Account deactivated successfully.');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                } else {
                    showAlert(res.message || 'Failed to delete account', 'error');
                }
            } catch (err) {
                showAlert('Connection error', 'error');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await api.logout();
            window.location.href = 'login.html';
        });

        function showAlert(msg, type) {
            const el = document.getElementById('alert');
            el.textContent = msg;
            el.className = `mb-6 p-4 rounded-lg text-sm ${type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }
    </script>
</body>
</html>
