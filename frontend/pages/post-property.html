<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Property – PrimeEstate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#1a3c5e', light: '#2d6a9f', dark: '#0f2540' },
                        accent:  { DEFAULT: '#e8a020', light: '#f0b93a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <nav class="bg-primary text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="../index.html" class="flex items-center space-x-1">
                <span class="text-accent text-2xl font-bold">Prime</span>
                <span class="text-white text-2xl font-bold">Estate</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="properties.html" class="text-sm text-gray-300 hover:text-white transition">Browse Properties</a>
                <span id="nav-user" class="text-sm text-gray-300"></span>
            </div>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto w-full px-4 py-10">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Post a Property</h1>
            <p class="text-gray-500 text-sm mt-1">Fill in the details below to list your property on PrimeEstate</p>
        </div>

        <div id="alert" class="hidden mb-6 p-4 rounded-xl text-sm"></div>

        <form id="post-form" class="space-y-8">

            <!-- Basic info -->
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wide mb-4">Basic Information</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Property Title <span class="text-red-500">*</span></label>
                        <input id="title" type="text" required placeholder="e.g. Modern 3-Bedroom House in Colombo 7"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
                        <textarea id="description" rows="4" placeholder="Describe the property, key features, nearby amenities..."
                                  class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary resize-none"></textarea>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Listing Type <span class="text-red-500">*</span></label>
                            <select id="type" required class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                                <option value="sale">For Sale</option>
                                <option value="rent">For Rent</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Category <span class="text-red-500">*</span></label>
                            <select id="category" required class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                                <option value="house">House</option>
                                <option value="apartment">Apartment</option>
                                <option value="villa">Villa</option>
                                <option value="land">Land</option>
                                <option value="commercial">Commercial</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Price (LKR) <span class="text-red-500">*</span></label>
                            <input id="price" type="number" min="0" required placeholder="e.g. 15000000"
                                   class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                        </div>
                    </div>
                </div>
            </div>

            <!-- Property specs -->
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wide mb-4">Property Specs</h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Bedrooms</label>
                        <input id="bedrooms" type="number" min="0" placeholder="0"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Bathrooms</label>
                        <input id="bathrooms" type="number" min="0" placeholder="0"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Area (sq ft)</label>
                        <input id="areaSqft" type="number" min="0" placeholder="0"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                </div>
            </div>

            <!-- Location -->
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wide mb-4">Location</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Street Address</label>
                        <input id="address" type="text" placeholder="No. 12, Example Road"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">City <span class="text-red-500">*</span></label>
                        <input id="city" type="text" required placeholder="e.g. Colombo"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">State / Province</label>
                        <input id="state" type="text" placeholder="e.g. Western Province"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">ZIP / Postal Code</label>
                        <input id="zipCode" type="text" placeholder="10000"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                </div>
            </div>

            <!-- Image -->
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wide mb-4">Property Image</h2>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Image URL</label>
                    <input id="imageUrl" type="url" placeholder="https://example.com/photo.jpg"
                           class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    <p class="text-xs text-gray-400 mt-1">Paste a direct link to the property photo</p>
                </div>
                <div id="img-preview" class="hidden mt-4">
                    <img id="preview-img" src="" alt="Preview"
                         class="w-full h-48 object-cover rounded-xl border border-gray-100" />
                </div>
            </div>

            <div class="flex gap-4">
                <button type="submit"
                        class="flex-1 bg-primary text-white py-3 rounded-xl font-semibold hover:bg-primary-dark transition">
                    Post Property
                </button>
                <a href="properties.html"
                   class="flex-1 text-center border border-gray-200 text-gray-600 py-3 rounded-xl font-semibold hover:bg-gray-50 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        // Require agent or admin
        async function checkAuth() {
            try {
                const res = await api.getMe();
                if (!res.success) { window.location.href = 'login.html'; return; }
                const role = res.data.role;
                if (role !== 'agent' && role !== 'admin') {
                    showAlert('Only agents and admins can post properties. Please register as an agent first.', 'error');
                    document.getElementById('post-form').querySelectorAll('input,select,textarea,button[type=submit]')
                        .forEach(el => el.disabled = true);
                    return;
                }
                document.getElementById('nav-user').textContent = `Hi, ${res.data.fullName.split(' ')[0]}`;
            } catch (_) {
                window.location.href = 'login.html';
            }
        }

        // Image preview
        document.getElementById('imageUrl').addEventListener('input', (e) => {
            const url = e.target.value.trim();
            const preview = document.getElementById('img-preview');
            const img     = document.getElementById('preview-img');
            if (url) { img.src = url; preview.classList.remove('hidden'); }
            else     { preview.classList.add('hidden'); }
        });

        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                title:       document.getElementById('title').value.trim(),
                description: document.getElementById('description').value.trim(),
                type:        document.getElementById('type').value,
                category:    document.getElementById('category').value,
                price:       parseFloat(document.getElementById('price').value),
                bedrooms:    parseInt(document.getElementById('bedrooms').value) || 0,
                bathrooms:   parseInt(document.getElementById('bathrooms').value) || 0,
                areaSqft:    parseInt(document.getElementById('areaSqft').value) || 0,
                address:     document.getElementById('address').value.trim(),
                city:        document.getElementById('city').value.trim(),
                state:       document.getElementById('state').value.trim(),
                zipCode:     document.getElementById('zipCode').value.trim(),
                imageUrl:    document.getElementById('imageUrl').value.trim(),
                status:      'available',
            };

            if (!data.title)    return showAlert('Property title is required', 'error');
            if (!data.price || data.price <= 0) return showAlert('Enter a valid price', 'error');
            if (!data.city)     return showAlert('City is required', 'error');

            try {
                const res = await api.createProperty(data);
                if (res.success) {
                    showAlert('Property posted successfully! Redirecting...', 'success');
                    setTimeout(() => window.location.href = `property-detail.html?id=${res.data.id}`, 1800);
                } else {
                    showAlert(res.message || 'Failed to post property', 'error');
                }
            } catch (_) {
                showAlert('Unable to connect. Is the server running?', 'error');
            }
        });

        function showAlert(msg, type) {
            const el = document.getElementById('alert');
            el.textContent = msg;
            el.className = `mb-6 p-4 rounded-xl text-sm ${type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
            el.classList.remove('hidden');
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        checkAuth();
    </script>
</body>
</html>
