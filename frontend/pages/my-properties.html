<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Listings – PrimeEstate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#1a3c5e', light: '#2d6a9f', dark: '#0f2540' },
                        accent:  { DEFAULT: '#e8a020', light: '#f0b93a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen">

    <!-- Navbar -->
    <nav class="bg-primary text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="../index.html" class="flex items-center space-x-1">
                <span class="text-accent text-2xl font-bold">Prime</span>
                <span class="text-white text-2xl font-bold">Estate</span>
            </a>
            <div class="flex items-center gap-5" id="nav-auth">
                <a href="post-property.html" class="text-sm hover:text-accent transition">Post Property</a>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="bg-primary-dark text-white py-10">
        <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold">My Listings</h1>
                <p class="text-gray-300 mt-2 text-sm">Manage all properties you have posted.</p>
            </div>
            <a href="post-property.html"
               class="flex items-center gap-2 bg-accent text-white px-5 py-2.5 rounded-lg font-semibold hover:bg-accent-light transition text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Post New
            </a>
        </div>
    </div>

    <!-- Filter Tabs -->
    <div class="max-w-6xl mx-auto px-4 mt-6">
        <div class="flex gap-2 flex-wrap">
            <button onclick="filterProps('all')"       id="tab-all"       class="tab-btn active-tab px-4 py-2 rounded-full text-sm font-medium transition">All</button>
            <button onclick="filterProps('available')" id="tab-available" class="tab-btn px-4 py-2 rounded-full text-sm font-medium transition">Available</button>
            <button onclick="filterProps('sold')"      id="tab-sold"      class="tab-btn px-4 py-2 rounded-full text-sm font-medium transition">Sold</button>
            <button onclick="filterProps('rented')"    id="tab-rented"    class="tab-btn px-4 py-2 rounded-full text-sm font-medium transition">Rented</button>
        </div>
    </div>

    <!-- Listings Grid -->
    <div class="max-w-6xl mx-auto px-4 py-6">
        <div id="listings-container">
            <div class="text-center py-16 text-gray-400">
                <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                </svg>
                <p>Loading listings...</p>
            </div>
        </div>
    </div>

    <footer class="bg-primary-dark text-gray-400 text-center py-6 mt-12 text-sm">
        &copy; 2025 PrimeEstate. All rights reserved.
    </footer>

    <!-- Edit Property Modal -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 overflow-y-auto">
        <div class="flex items-start justify-center min-h-full px-4 py-8">
        <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-2xl">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-primary">Edit Listing</h2>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 text-3xl leading-none font-light">&times;</button>
            </div>
            <div id="edit-alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
            <form id="edit-form" class="space-y-5" onsubmit="submitEdit(event)">
                <input type="hidden" id="edit-id" />

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Title <span class="text-red-500">*</span></label>
                        <input type="text" id="edit-title" required
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Listing Type</label>
                        <select id="edit-type" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                            <option value="sale">For Sale</option>
                            <option value="rent">For Rent</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
                        <select id="edit-category" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                            <option value="house">House</option>
                            <option value="apartment">Apartment</option>
                            <option value="villa">Villa</option>
                            <option value="land">Land</option>
                            <option value="commercial">Commercial</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Price (LKR) <span class="text-red-500">*</span></label>
                        <input type="number" id="edit-price" required min="0"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Status</label>
                        <select id="edit-status" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                            <option value="available">Available</option>
                            <option value="sold">Sold</option>
                            <option value="rented">Rented</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Bedrooms</label>
                        <input type="number" id="edit-bedrooms" min="0"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Bathrooms</label>
                        <input type="number" id="edit-bathrooms" min="0"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Area (sq ft)</label>
                        <input type="number" id="edit-area" min="0"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">City <span class="text-red-500">*</span></label>
                        <input type="text" id="edit-city" required
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">State / Province</label>
                        <input type="text" id="edit-state"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Address</label>
                        <input type="text" id="edit-address"
                               class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
                        <textarea id="edit-description" rows="3"
                                  class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary resize-none"></textarea>
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit"
                            class="flex-1 bg-primary text-white py-2.5 rounded-lg font-semibold hover:bg-primary-dark transition">
                        Save Changes
                    </button>
                    <button type="button" onclick="closeEditModal()"
                            class="flex-1 border border-gray-200 text-gray-600 py-2.5 rounded-lg font-semibold hover:bg-gray-50 transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div id="delete-modal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50">
        <div class="flex items-center justify-center h-full px-4">
        <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm text-center">
            <div class="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </div>
            <h3 class="text-lg font-bold text-gray-800 mb-2">Delete Listing?</h3>
            <p class="text-sm text-gray-500 mb-6">This will permanently remove the listing and all its images.</p>
            <input type="hidden" id="delete-id" />
            <div class="flex gap-3">
                <button onclick="confirmDelete()"
                        class="flex-1 bg-red-500 text-white py-2.5 rounded-lg font-semibold hover:bg-red-600 transition">
                    Delete
                </button>
                <button onclick="closeDeleteModal()"
                        class="flex-1 border border-gray-200 text-gray-600 py-2.5 rounded-lg font-semibold hover:bg-gray-50 transition">
                    Cancel
                </button>
            </div>
        </div>
        </div>
    </div>

    <style>
        .tab-btn { background: white; color: #6b7280; border: 1px solid #e5e7eb; }
        .active-tab { background: #1a3c5e; color: white; border-color: #1a3c5e; }
    </style>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        let allListings  = [];
        let currentFilter = 'all';

        const statusCfg = {
            available: { label: 'Available', cls: 'bg-green-100 text-green-700' },
            sold:      { label: 'Sold',      cls: 'bg-gray-200  text-gray-600'  },
            rented:    { label: 'Rented',    cls: 'bg-blue-100  text-blue-700'  }
        };

        async function init() {
            const userData = sessionStorage.getItem('user');
            if (!userData) { window.location.href = 'login.html'; return; }
            let user = JSON.parse(userData);
            if (user.role !== 'agent') { window.location.href = '../index.html'; return; }

            // Resolve agentId if missing (logged in before feature was deployed)
            if (!user.agentId) {
                try {
                    const r = await api.getAgentByUserId(user.id);
                    if (r.success && r.data) {
                        user.agentId = r.data.id;
                        sessionStorage.setItem('user', JSON.stringify(user));
                    } else {
                        showEmpty('Agent profile not found. Please log out and log in again.');
                        return;
                    }
                } catch (_) { showEmpty('Could not connect to server.'); return; }
            }

            await loadListings(user.id);
        }

        async function loadListings(userId) {
            try {
                const res = await api.getMyProperties(userId);
                if (res.success) {
                    allListings = Array.isArray(res.data) ? res.data : [];
                    renderListings(allListings);
                } else {
                    showEmpty('Failed to load listings.');
                }
            } catch (e) {
                showEmpty('Could not connect to the server.');
            }
        }

        function filterProps(status) {
            currentFilter = status;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(`tab-${status}`).classList.add('active-tab');
            const filtered = status === 'all' ? allListings : allListings.filter(p => p.status === status);
            renderListings(filtered);
        }

        function renderListings(list) {
            const container = document.getElementById('listings-container');
            if (!list.length) {
                container.innerHTML = `
                    <div class="text-center py-16 text-gray-400">
                        <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                        </svg>
                        <p class="font-medium">No listings found</p>
                        <a href="post-property.html" class="inline-block mt-4 bg-primary text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-primary-dark transition">
                            Post Your First Property
                        </a>
                    </div>`;
                return;
            }

            container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                ${list.map(p => {
                    const sc    = statusCfg[p.status] || { label: p.status, cls: 'bg-gray-100 text-gray-500' };
                    const img   = p.imageUrl || (p.additionalImages && p.additionalImages[0]) || '';
                    const price = p.type === 'rent'
                        ? `LKR ${Number(p.price).toLocaleString()}/mo`
                        : `LKR ${Number(p.price).toLocaleString()}`;

                    return `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
                        <div class="relative">
                            ${img
                                ? `<img src="${img}" alt="${escapeHtml(p.title)}" class="w-full h-44 object-cover" onerror="this.src='https://placehold.co/400x180/1a3c5e/ffffff?text=PrimeEstate'" />`
                                : `<div class="w-full h-44 bg-primary flex items-center justify-center text-white font-bold text-lg">PrimeEstate</div>`}
                            <span class="absolute top-3 left-3 text-xs font-semibold px-2.5 py-1 rounded-full ${sc.cls}">${sc.label}</span>
                            <span class="absolute top-3 right-3 text-xs font-semibold px-2.5 py-1 rounded-full ${p.type === 'rent' ? 'bg-blue-600' : 'bg-green-600'} text-white capitalize">${p.type === 'rent' ? 'For Rent' : 'For Sale'}</span>
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-gray-800 text-sm mb-1 truncate">${escapeHtml(p.title)}</h3>
                            <p class="text-xs text-gray-500 mb-3">${escapeHtml(p.city)}${p.state ? ', ' + escapeHtml(p.state) : ''}</p>
                            <div class="flex items-center gap-3 text-xs text-gray-500 mb-3">
                                ${p.bedrooms ? `<span>${p.bedrooms} Beds</span>` : ''}
                                ${p.bathrooms ? `<span>${p.bathrooms} Baths</span>` : ''}
                                ${p.areaSqft ? `<span>${Number(p.areaSqft).toLocaleString()} sqft</span>` : ''}
                            </div>
                            <p class="font-bold text-primary mb-4">${price}</p>
                            <div class="flex gap-2">
                                <button onclick="openEditModal(${JSON.stringify(p).replace(/"/g,'&quot;')})"
                                        class="flex-1 flex items-center justify-center gap-1.5 bg-primary text-white py-2 rounded-lg text-xs font-semibold hover:bg-primary-dark transition">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                    Edit
                                </button>
                                <a href="property-detail.html?id=${p.id}"
                                   class="flex items-center justify-center gap-1.5 border border-gray-200 text-gray-600 px-3 py-2 rounded-lg text-xs font-semibold hover:bg-gray-50 transition">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                    View
                                </a>
                                <button onclick="openDeleteModal(${p.id})"
                                        class="flex items-center justify-center gap-1.5 border border-red-200 text-red-500 px-3 py-2 rounded-lg text-xs font-semibold hover:bg-red-50 transition">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>`;
                }).join('')}
            </div>`;
        }

        function openEditModal(p) {
            document.getElementById('edit-id').value          = p.id;
            document.getElementById('edit-title').value       = p.title || '';
            document.getElementById('edit-type').value        = p.type || 'sale';
            document.getElementById('edit-category').value    = p.category || 'house';
            document.getElementById('edit-price').value       = p.price || '';
            document.getElementById('edit-status').value      = p.status || 'available';
            document.getElementById('edit-bedrooms').value    = p.bedrooms || '';
            document.getElementById('edit-bathrooms').value   = p.bathrooms || '';
            document.getElementById('edit-area').value        = p.areaSqft || '';
            document.getElementById('edit-city').value        = p.city || '';
            document.getElementById('edit-state').value       = p.state || '';
            document.getElementById('edit-address').value     = p.address || '';
            document.getElementById('edit-description').value = p.description || '';
            hideAlert('edit-alert');
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function submitEdit(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const data = {
                title:       document.getElementById('edit-title').value.trim(),
                type:        document.getElementById('edit-type').value,
                category:    document.getElementById('edit-category').value,
                price:       parseFloat(document.getElementById('edit-price').value),
                status:      document.getElementById('edit-status').value,
                bedrooms:    parseInt(document.getElementById('edit-bedrooms').value) || 0,
                bathrooms:   parseInt(document.getElementById('edit-bathrooms').value) || 0,
                areaSqft:    parseInt(document.getElementById('edit-area').value) || 0,
                city:        document.getElementById('edit-city').value.trim(),
                state:       document.getElementById('edit-state').value.trim(),
                address:     document.getElementById('edit-address').value.trim(),
                description: document.getElementById('edit-description').value.trim()
            };

            try {
                const res = await api.updateProperty(id, data);
                if (res.success) {
                    closeEditModal();
                    const user = JSON.parse(sessionStorage.getItem('user'));
                    await loadListings(user.id);
                    filterProps(currentFilter);
                } else {
                    showAlert('edit-alert', res.message || 'Failed to update.', 'error');
                }
            } catch (_) {
                showAlert('edit-alert', 'Could not connect to server.', 'error');
            }
        }

        function openDeleteModal(id) {
            document.getElementById('delete-id').value = id;
            document.getElementById('delete-modal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.add('hidden');
        }

        async function confirmDelete() {
            const id = document.getElementById('delete-id').value;
            try {
                const res = await api.deleteProperty(id);
                if (res.success) {
                    closeDeleteModal();
                    const user = JSON.parse(sessionStorage.getItem('user'));
                    await loadListings(user.id);
                    filterProps(currentFilter);
                }
            } catch (_) { closeDeleteModal(); }
        }

        function showEmpty(msg) {
            document.getElementById('listings-container').innerHTML =
                `<div class="text-center py-16 text-gray-400"><p>${msg}</p></div>`;
        }

        function showAlert(id, msg, type) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = `mb-4 p-3 rounded-lg text-sm ${type === 'error' ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700'}`;
            el.classList.remove('hidden');
        }

        function hideAlert(id) { document.getElementById(id).classList.add('hidden'); }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        init();
    </script>
</body>
</html>
