<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile – PrimeEstate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#1a3c5e', light: '#2d6a9f', dark: '#0f2540' },
                        accent:  { DEFAULT: '#e8a020', light: '#f0b93a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">

    <nav class="bg-primary text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="../index.html" class="flex items-center space-x-1">
                <span class="text-accent text-2xl font-bold">Prime</span>
                <span class="text-white text-2xl font-bold">Estate</span>
            </a>
            <div id="nav-auth" class="flex items-center gap-4"></div>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto px-4 py-10">

        <div id="profile-loading" class="text-center py-20 text-gray-400">Loading profile...</div>

        <div id="profile-content" class="hidden space-y-6">

            <!-- Header card -->
            <div class="bg-white rounded-2xl shadow p-8 flex items-center gap-6">
                <div id="avatar"
                     class="w-20 h-20 rounded-full bg-primary flex items-center justify-center text-white text-2xl font-bold flex-shrink-0 select-none">
                    ?
                </div>
                <div>
                    <h1 id="profile-name" class="text-2xl font-bold text-primary"></h1>
                    <p id="profile-email" class="text-gray-500 text-sm mt-0.5"></p>
                    <span id="profile-role-badge"
                          class="mt-2 inline-block text-xs px-3 py-1 rounded-full font-semibold"></span>
                </div>
            </div>

            <!-- Alert -->
            <div id="profile-alert" class="hidden p-4 rounded-xl text-sm"></div>

            <!-- Edit form -->
            <div class="bg-white rounded-2xl shadow p-8">
                <h2 class="text-lg font-bold text-primary mb-6">Edit Profile</h2>
                <form id="profile-form" class="space-y-4" onsubmit="saveProfile(event)">

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">
                                Full Name <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="pf-name" required
                                   class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">
                                Email <span class="text-red-500">*</span>
                            </label>
                            <input type="email" id="pf-email" required
                                   class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Phone</label>
                        <input type="tel" id="pf-phone"
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">
                            New Password
                            <span class="text-gray-400 font-normal">(leave blank to keep current)</span>
                        </label>
                        <input type="password" id="pf-password" autocomplete="new-password"
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                    </div>

                    <!-- Agent-only section -->
                    <div id="agent-fields" class="hidden space-y-4 pt-4 border-t border-gray-100">
                        <h3 class="text-sm font-bold text-primary">Agent Details</h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Contact Number</label>
                                <input type="tel" id="pf-contact"
                                       class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Location</label>
                                <input type="text" id="pf-location" placeholder="City, Country"
                                       class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Years of Experience</label>
                                <input type="number" id="pf-experience" min="0" max="60"
                                       class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Specialization</label>
                                <select id="pf-specialization"
                                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary bg-white">
                                    <option value="house">House</option>
                                    <option value="apartment">Apartment</option>
                                    <option value="land">Land</option>
                                    <option value="commercial">Commercial</option>
                                    <option value="villa">Villa</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Availability Status</label>
                            <select id="pf-availability"
                                    class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary bg-white">
                                <option value="available">Available</option>
                                <option value="busy">Busy</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="save-btn"
                                class="bg-primary text-white px-8 py-2.5 rounded-lg font-semibold hover:bg-primary-dark transition text-sm">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>

            <!-- Danger zone -->
            <div class="bg-white rounded-2xl shadow p-8 border border-red-100">
                <h2 class="text-lg font-bold text-red-600 mb-2">Danger Zone</h2>
                <p class="text-sm text-gray-500 mb-5">
                    Permanently delete your account and all associated data. This action cannot be undone.
                </p>
                <button onclick="deleteAccount()"
                        class="bg-red-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-red-700 transition text-sm">
                    Delete My Account
                </button>
            </div>

        </div>
    </div>

    <footer class="bg-primary-dark text-gray-400 text-center py-6 mt-12 text-sm">
        &copy; 2025 PrimeEstate. All rights reserved.
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        let currentUser  = null;
        let currentAgent = null;

        async function loadProfile() {
            try {
                const meRes = await api.getMe();
                if (!meRes.success) { window.location.href = 'login.html'; return; }
                currentUser = meRes.data;
            } catch (_) { window.location.href = 'login.html'; return; }

            // Header
            const initials = currentUser.fullName.trim().split(/\s+/).map(n => n[0]).join('').toUpperCase().slice(0, 2);
            document.getElementById('avatar').textContent        = initials;
            document.getElementById('profile-name').textContent  = currentUser.fullName;
            document.getElementById('profile-email').textContent = currentUser.email;

            const roleMap = {
                buyer: { label: 'Buyer',           cls: 'bg-gray-100 text-gray-700'  },
                agent: { label: 'Property Seller', cls: 'bg-blue-100 text-blue-700'  },
                admin: { label: 'Administrator',   cls: 'bg-red-100  text-red-700'   },
            };
            const r = roleMap[currentUser.role] || { label: currentUser.role, cls: 'bg-gray-100 text-gray-700' };
            const badge = document.getElementById('profile-role-badge');
            badge.textContent = r.label;
            badge.className   = `mt-2 inline-block text-xs px-3 py-1 rounded-full font-semibold ${r.cls}`;

            // Form
            document.getElementById('pf-name').value  = currentUser.fullName;
            document.getElementById('pf-email').value = currentUser.email;
            document.getElementById('pf-phone').value = currentUser.phone || '';

            // Agent extras
            if (currentUser.role === 'agent') {
                document.getElementById('agent-fields').classList.remove('hidden');
                try {
                    const agentRes = await api.getAgentByUserId(currentUser.id);
                    if (agentRes.success && agentRes.data) {
                        currentAgent = agentRes.data;
                        document.getElementById('pf-contact').value        = currentAgent.contactNumber || '';
                        document.getElementById('pf-location').value       = currentAgent.location || '';
                        document.getElementById('pf-experience').value     = currentAgent.experienceYears ?? 0;
                        document.getElementById('pf-specialization').value = currentAgent.propertySpecialization || 'house';
                        document.getElementById('pf-availability').value   = currentAgent.availabilityStatus || 'available';
                    }
                } catch (_) {}
            }

            document.getElementById('profile-loading').classList.add('hidden');
            document.getElementById('profile-content').classList.remove('hidden');
        }

        async function saveProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const userData = {
                fullName:      document.getElementById('pf-name').value.trim(),
                email:         document.getElementById('pf-email').value.trim(),
                phone:         document.getElementById('pf-phone').value.trim(),
                role:          currentUser.role,
                accountStatus: currentUser.accountStatus,
            };
            const newPass = document.getElementById('pf-password').value;
            if (newPass) userData.password = newPass;

            try {
                const res = await api.updateUser(currentUser.id, userData);
                if (!res.success) {
                    showAlert(res.message || 'Update failed.', 'error');
                    btn.disabled = false; btn.textContent = 'Save Changes';
                    return;
                }

                if (currentUser.role === 'agent' && currentAgent) {
                    const agentData = {
                        fullName:               userData.fullName,
                        email:                  userData.email,
                        contactNumber:          document.getElementById('pf-contact').value.trim(),
                        location:               document.getElementById('pf-location').value.trim(),
                        experienceYears:        parseInt(document.getElementById('pf-experience').value) || 0,
                        propertySpecialization: document.getElementById('pf-specialization').value,
                        availabilityStatus:     document.getElementById('pf-availability').value,
                    };
                    await api.updateAgent(currentAgent.id, agentData);
                }

                // Refresh session name
                const stored = JSON.parse(sessionStorage.getItem('user') || '{}');
                stored.fullName = userData.fullName;
                sessionStorage.setItem('user', JSON.stringify(stored));

                // Update header display
                document.getElementById('profile-name').textContent  = userData.fullName;
                document.getElementById('profile-email').textContent = userData.email;
                const initials = userData.fullName.trim().split(/\s+/).map(n => n[0]).join('').toUpperCase().slice(0, 2);
                document.getElementById('avatar').textContent = initials;

                document.getElementById('pf-password').value = '';
                showAlert('Profile updated successfully.', 'success');
            } catch (_) {
                showAlert('Connection error. Please try again.', 'error');
            }

            btn.disabled = false; btn.textContent = 'Save Changes';
        }

        async function deleteAccount() {
            if (!confirm('Delete your account permanently? All your data will be removed and cannot be recovered.')) return;
            if (!confirm('Are you absolutely sure? This cannot be undone.')) return;

            try {
                if (currentUser.role === 'agent' && currentAgent) {
                    await api.deleteAgent(currentAgent.id);
                }
                const res = await api.deleteUser(currentUser.id);
                if (res.success) {
                    sessionStorage.removeItem('user');
                    try { await api.logout(); } catch (_) {}
                    alert('Your account has been deleted.');
                    window.location.href = '../index.html';
                } else {
                    alert(res.message || 'Failed to delete account.');
                }
            } catch (_) {
                alert('Connection error. Please try again.');
            }
        }

        function showAlert(msg, type) {
            const el = document.getElementById('profile-alert');
            el.textContent = msg;
            el.className = `p-4 rounded-xl text-sm ${type === 'error'
                ? 'bg-red-50 text-red-700 border border-red-200'
                : 'bg-green-50 text-green-700 border border-green-200'}`;
            el.classList.remove('hidden');
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            if (type === 'success') setTimeout(() => el.classList.add('hidden'), 4000);
        }

        loadProfile();
    </script>
</body>
</html>
