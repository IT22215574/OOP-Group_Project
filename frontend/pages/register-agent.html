<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Registration – PrimeEstate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#1a3c5e', light: '#2d6a9f', dark: '#0f2540' },
                        accent:  { DEFAULT: '#e8a020', light: '#f0b93a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <nav class="bg-primary text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center">
            <a href="../index.html" class="flex items-center space-x-1">
                <span class="text-accent text-2xl font-bold">Prime</span>
                <span class="text-white text-2xl font-bold">Estate</span>
                <span class="ml-2 text-xs bg-blue-600 px-2 py-1 rounded">Agent Portal</span>
            </a>
        </div>
    </nav>

    <div class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-8 border-t-4 border-blue-500">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-primary mb-1">Agent Registration</h1>
                <p class="text-gray-500 text-sm">Create your professional profile</p>
            </div>

            <div id="alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

            <form id="register-agent-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                    <input id="fullName" type="text" required placeholder="Jane Doe"
                           class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                    <input id="email" type="email" required placeholder="agent@primeestate.lk"
                           class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Contact Number</label>
                    <input id="phone" type="tel" required placeholder="077 123 4567"
                           class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input id="password" type="password" required placeholder="Min. 8 characters"
                           class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Specialization</label>
                    <select id="specialization" required class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary bg-white">
                        <option value="">Select Specialization...</option>
                        <option value="Residential">Residential</option>
                        <option value="Commercial">Commercial</option>
                        <option value="Luxury">Luxury</option>
                        <option value="Rental">Rental</option>
                    </select>
                </div>
                <button type="submit"
                        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition mt-2 shadow-md">
                    Register as Agent
                </button>
            </form>

            <p class="text-center text-sm text-gray-500 mt-6">
                Are you a buyer/client? 
                <a href="register.html" class="text-primary font-semibold hover:text-accent transition">Register here</a>
            </p>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.getElementById('register-agent-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName        = document.getElementById('fullName').value.trim();
            const email           = document.getElementById('email').value.trim();
            const contactNumber   = document.getElementById('phone').value.trim();
            const password        = document.getElementById('password').value;
            const specialization  = document.getElementById('specialization').value;

            if (password.length < 8) {
                return showAlert('Password must be at least 8 characters', 'error');
            }

            try {
                // Temporary fetch until we update api.js to include agent mapping
                const res = await fetch(`${CONFIG.API_BASE}/api/agents/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, contactNumber, password, specialization })
                }).then(r => r.json());

                if (res.success) {
                    showAlert('Agent Account created! Redirecting to login...', 'success');
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    showAlert(res.message || 'Registration failed', 'error');
                }
            } catch (err) {
                showAlert('Unable to connect. Is the server running?', 'error');
            }
        });

        function showAlert(msg, type) {
            const el = document.getElementById('alert');
            el.textContent = msg;
            el.className = `mb-4 p-3 rounded-lg text-sm ${type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
