<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#1a3c5e', light: '#2d6a9f', dark: '#0f2540' },
                        accent:  { DEFAULT: '#e8a020', light: '#f0b93a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <nav class="bg-primary text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="../index.html" class="flex items-center space-x-1">
                <span class="text-accent text-2xl font-bold">Prime</span>
                <span class="text-white text-2xl font-bold">Estate</span>
                <span class="ml-2 text-xs bg-red-600 px-2 py-1 rounded">Admin</span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="../index.html" class="hover:text-accent transition">Home</a>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition hidden">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="flex-1 max-w-7xl mx-auto w-full px-4 py-8">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-primary">User Directory</h1>
                <p class="text-gray-500 text-sm mt-1">Search and manage platform users</p>
            </div>
            
            <div class="flex w-full md:w-auto space-x-2">
                <input id="searchInput" type="text" placeholder="Search by name, email..."
                       class="w-full md:w-64 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" />
                <button id="searchBtn" class="bg-primary text-white px-6 py-2 rounded-lg text-sm font-semibold hover:bg-primary-dark transition shadow-md">
                    Search
                </button>
            </div>
        </div>

        <div id="alert" class="hidden mb-6 p-4 rounded-lg text-sm"></div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-100 text-gray-700 text-xs uppercase font-semibold border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Name</th>
                            <th class="px-6 py-4">Email</th>
                            <th class="px-6 py-4">Role</th>
                            <th class="px-6 py-4">Location</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-gray-100">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
            <div id="loading" class="text-center py-12 text-gray-400">Loading users...</div>
            <div id="emptyState" class="hidden text-center py-12 text-gray-400">No users found.</div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await api.getMe();
                if (res.success && res.data) {
                    currentUser = res.data;
                    document.getElementById('logoutBtn').classList.remove('hidden');
                    // Only allow admin users here
                    if (!currentUser.isAdmin) return window.location.href = '../pages/login.html';
                    loadUsers();
                } else {
                    window.location.href = 'login.html';
                }
            } catch (err) {
                console.error(err);
                window.location.href = 'login.html';
            }
        });

        async function loadUsers(searchQuery = '') {
            const tbody = document.getElementById('userTableBody');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('emptyState');
            
            tbody.innerHTML = '';
            loading.classList.remove('hidden');
            emptyState.classList.add('hidden');

            try {
                const params = {};
                if (searchQuery) params.name = searchQuery; // Basic search mapping

                // Use admin endpoint which sends Role: ADMIN header
                const res = await api.adminGetUsers();
                loading.classList.add('hidden');

                if (res.success && res.data && res.data.length > 0) {
                    renderUsers(res.data);
                } else {
                    emptyState.classList.remove('hidden');
                }
            } catch (err) {
                loading.classList.add('hidden');
                showAlert('Failed to load users from the server', 'error');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('userTableBody');
            users.forEach(user => {
                const roleBadge = user.role === 'admin' 
                    ? `<span class="bg-red-100 text-red-800 text-xs font-medium px-2.5 py-0.5 rounded border border-red-200">Admin</span>`
                    : user.role === 'agent'
                    ? `<span class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded border border-blue-200">Agent</span>`
                    : `<span class="bg-green-100 text-green-800 text-xs font-medium px-2.5 py-0.5 rounded border border-green-200">Client</span>`;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";

                // More robust self-check: compare id and email (some test accounts may not have id)
                const isSelf = currentUser && (user.id === currentUser.id || (currentUser.email && user.email === currentUser.email));

                const actions = isSelf
                    ? `<button disabled class="text-gray-300 font-semibold text-sm">Delete</button>`
                    : `<button onclick="deleteUser(${user.id})" class="text-red-500 hover:text-red-700 font-semibold text-sm transition">Delete</button>`;

                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-gray-900">#${user.id}</td>
                    <td class="px-6 py-4">${user.name || '-'}</td>
                    <td class="px-6 py-4">${user.email}</td>
                    <td class="px-6 py-4">${user.accountStatus}</td>
                    <td class="px-6 py-4">${user.preferredLocation || '-'}</td>
                    <td class="px-6 py-4 text-right">${actions}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('searchBtn').addEventListener('click', () => {
            const query = document.getElementById('searchInput').value.trim();
            loadUsers(query);
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = document.getElementById('searchInput').value.trim();
                loadUsers(query);
            }
        });

        window.deleteUser = async function(id) {
            if (id === currentUser.id) {
                return alert("You cannot delete your own admin account from here. Use the profile page.");
            }
            if (!confirm('Are you sure you want to delete this user? This cannot be undone.')) return;

            try {
                const res = await api.adminDeleteUser(id);
                if (res.success) {
                    showAlert('User deleted successfully', 'success');
                    loadUsers(document.getElementById('searchInput').value.trim()); // Refresh
                } else {
                    showAlert(res.message || 'Failed to delete user', 'error');
                }
            } catch (err) {
                showAlert('Connection error', 'error');
            }
        };

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await api.logout();
            window.location.href = 'login.html';
        });

        function showAlert(msg, type) {
            const el = document.getElementById('alert');
            el.textContent = msg;
            el.className = `mb-6 p-4 rounded-lg text-sm ${type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }
    </script>
</body>
</html>
