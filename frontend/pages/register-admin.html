<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Admin – PrimeEstate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#1a3c5e', light: '#2d6a9f', dark: '#0f2540' },
                        accent:  { DEFAULT: '#e8a020', light: '#f0b93a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <nav class="bg-primary text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center">
            <a href="../index.html" class="flex items-center space-x-1">
                <span class="text-accent text-2xl font-bold">Prime</span>
                <span class="text-white text-2xl font-bold">Estate</span>
                <span class="ml-2 text-xs bg-red-600 px-2 py-1 rounded">Admin</span>
            </a>
        </div>
    </nav>

    <div class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-primary mb-1">Create Admin Account</h1>
                <p class="text-gray-500 text-sm">Register a new administrator</p>
            </div>

            <div id="alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                    <input id="fullName" type="text" required placeholder="Admin Name"
                           class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                    <input id="email" type="email" required placeholder="admin@example.com"
                           class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input id="password" type="password" required placeholder="Min. 8 characters"
                           class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Confirm Password</label>
                    <input id="confirmPassword" type="password" required placeholder="Re-enter password"
                           class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
                </div>
                <button type="submit"
                        class="w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition mt-2">
                    Create Admin Account
                </button>
            </form>

            <p class="text-center text-sm text-gray-500 mt-6">
                Already have an account?
                <a href="login.html" class="text-primary font-semibold hover:text-accent transition">Sign In</a>
            </p>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name    = document.getElementById('fullName').value.trim();
            const email   = document.getElementById('email').value.trim();
            const password= document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) return showAlert('Passwords do not match', 'error');
            if (password.length < 8) return showAlert('Password must be at least 8 characters', 'error');

            try {
                const res = await api.register({ name, email, password });
                if (res.success) {
                    // Mark as admin client-side and persist so admin UI becomes available
                    const user = res.data || { id: null, name, email };
                    user.isAdmin = true;
                    const serialized = JSON.stringify(user);
                    localStorage.setItem('user', serialized);
                    sessionStorage.setItem('user', serialized);
                    showAlert('Admin account created! Redirecting to admin panel...', 'success');
                    setTimeout(() => window.location.href = 'admin-users.html', 1200);
                } else {
                    showAlert(res.message || 'Registration failed', 'error');
                }
            } catch (err) {
                showAlert('Unable to connect. Is the server running?', 'error');
            }
        });

        function showAlert(msg, type) {
            const el = document.getElementById('alert');
            el.textContent = msg;
            el.className = `mb-4 p-3 rounded-lg text-sm ${type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
